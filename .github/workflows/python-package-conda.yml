name: CI

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r divergence/requirements.txt flake8 pytest pip-audit
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest || [ $? -eq 5 ]
    - name: Citation matcher self-test
      run: |
        cd divergence
        python citation_matcher.py
    - name: Gap constraint enforcer self-test
      run: |
        cd divergence
        python gap_enforcer.py --self-test
    - name: Scope-reach enforcer self-test
      run: |
        cd divergence
        python scope_enforcer.py --self-test
    - name: Corpus integrity hash check
      run: |
        cd divergence
        python corpus_hash.py --verify
    - name: Prompt-injection scanner self-test
      run: |
        cd divergence
        python injection_scanner.py --self-test
    - name: Disagreement gate self-test (Arm D)
      run: |
        cd divergence
        python disagreement_gate.py --self-test
    - name: Capability-probe classifier self-test (S8)
      run: |
        cd divergence
        python capability_probe.py --self-test
    - name: Mutation harness self-test (mutate.py)
      run: |
        cd divergence
        python mutate.py --self-test
    - name: Replay reproducibility check (no API key)
      run: |
        cd divergence
        python run_pipeline.py --record-id CI-replay-check --tax-year "FY 2026-27" --text cases/D1/input.md --node5 --out runs/ci_replay_check.json
        python -c "
        import json
        rec = json.load(open('runs/ci_replay_check.json', encoding='utf-8'))
        orig = json.load(open('runs/21aug/D1_final_seed2.json', encoding='utf-8'))
        attack = json.load(open('runs/21aug/D1_final_seed2_attack.json', encoding='utf-8'))
        assert rec['facts'] == orig['facts'], 'replayed facts do not match the frozen record'
        assert rec['missing'] == orig['missing'], 'replayed missing[] does not match the frozen record'
        assert rec['attacked'] == attack['attacked'], 'replayed attacked[] does not match the frozen record'
        assert rec['_meta']['llm']['provider'] == 'replay', 'record does not show it was actually replayed'
        print('replay reproducibility: OK -- facts, missing, and attacked all match the frozen record byte-for-byte, with 0 API calls')
        "
      env:
        DIVERGENCE_REPLAY: "1"
    - name: Gate 0 pre-submission audit
      run: |
        cd divergence
        python gate0_check.py
    - name: Accessibility audit
      run: |
        cd divergence
        python a11y_check.py --all
    - name: Dependency vulnerability audit
      run: |
        python -m pip_audit -r divergence/requirements.txt
